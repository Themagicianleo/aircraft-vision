# Generates AircraftVision.xcodeproj: `brew install xcodegen && xcodegen generate` (CI does this).
name: AircraftVision
options:
  bundleIdPrefix: com.themagicianleo
  deploymentTarget:
    iOS: "17.0"
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.20.0
targets:
  AircraftVision:
    type: application
    platform: iOS
    sources:
      - path: AircraftVision
      # aircraft.onnx + labels.json, copied in from a release by CI (see Model/README.md)
      - path: Model
        buildPhase: resources
        excludes: ["README.md"]
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    info:
      path: AircraftVision/Info.plist
      properties:
        CFBundleDisplayName: Aircraft Vision
        NSCameraUsageDescription: Point your camera at an aircraft to identify it. Photos never leave your phone.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.themagicianleo.aircraftvision
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
