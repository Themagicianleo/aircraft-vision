name: iOS app

# Builds an unsigned iPhone app (.ipa) with the model from the latest release, and on main
# attaches it to that release. Install it with Sideloadly/AltStore and a free Apple ID (see README).
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write  # to attach the .ipa to the release
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Use the trained model from the latest release
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern aircraft_model.zip --dir /tmp/model
          unzip -o -q /tmp/model/aircraft_model.zip -d /tmp/model
          cp /tmp/model/aircraft.onnx /tmp/model/labels.json Model/
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project AircraftVision.xcodeproj -scheme AircraftVision -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error|warning: unre|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/AircraftVision.app

      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          errors=$(grep -E "error:" build.log | sort -u | head -n 30)
          echo "::error title=iOS build failed::$(echo "${errors:-$(tail -n 30 build.log)}" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AircraftVision.app Payload/
          zip -qry AircraftVision.ipa Payload
          ls -la AircraftVision.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: aircraft-vision-ipa
          path: ios/AircraftVision.ipa

      - name: Attach to the release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.model.outputs.tag }}
        run: |
          gh release upload "$TAG" AircraftVision.ipa --repo "$GITHUB_REPOSITORY" --clobber
          echo "::notice title=Attached::AircraftVision.ipa -> ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
