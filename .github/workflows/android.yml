name: Android APK

# Builds the app with the model from the latest release (made by train-model.yml),
# and on main publishes the new app as a release, so
# https://github.com/<owner>/<repo>/releases/latest always has the newest app.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to publish the release
      actions: write   # to start the iPhone and web builds for it
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Use the trained model from the latest release
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$tag" ]; then echo "No release yet; using the model in the repo."; exit 0; fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern aircraft_model.zip --dir /tmp/model
          unzip -o -q /tmp/model/aircraft_model.zip -d /tmp/model
          cp /tmp/model/aircraft.onnx /tmp/model/labels.json app/src/main/assets/
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using model from release $tag"

      - name: Build debug APK
        shell: bash
        run: ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          errors=$(grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -n 40)
          echo "::error title=Build failed::$(echo "${errors:-$(tail -n 30 build.log)}" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"

      - uses: actions/upload-artifact@v4
        with:
          name: aircraft-vision-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish app release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.model.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_TAG: ${{ steps.model.outputs.tag }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AircraftVision.apk
          {
            echo "App update built from \`${GITHUB_SHA::7}\` with the model from **$MODEL_TAG**."
            echo
            gh release view "$MODEL_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | sed '/^## Install on Android/,/^## /{/^## This model/!d}'
          } > notes.md
          sed -i '1i ## Install on Android\n1. On your phone, tap **AircraftVision.apk** below to download it.\n2. Open the downloaded file. If Android asks, allow installing apps from your browser.\n3. If it says the app can'"'"'t be installed over an existing one, uninstall the old Aircraft Vision first.\n' notes.md
          gh release create "app-${{ github.run_number }}" AircraftVision.apk /tmp/model/aircraft_model.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Aircraft Vision app #${{ github.run_number }}" --notes-file notes.md
          echo "::notice title=Released::${{ github.server_url }}/${{ github.repository }}/releases/tag/app-${{ github.run_number }}"

      - name: Build the iPhone app and refresh the web app for this release too
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ios.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
