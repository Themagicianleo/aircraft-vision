<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aircraft Vision">
  <meta name="description" content="Identify aircraft from a photo, entirely on your phone.">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Aircraft Vision</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- Material Symbols (Apache 2.0) -->
    <symbol id="i-flight" viewBox="0 0 24 24"><path d="M21,16v-2l-8,-5V3.5c0,-0.83 -0.67,-1.5 -1.5,-1.5S10,2.67 10,3.5V9l-8,5v2l8,-2.5V19l-2,1.5V22l3.5,-1 3.5,1v-1.5L13,19v-5.5l8,2.5z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5,14h-0.79l-0.28,-0.27C15.41,12.59 16,11.11 16,9.5 16,5.91 13.09,3 9.5,3S3,5.91 3,9.5 5.91,16 9.5,16c1.61,0 3.09,-0.59 4.23,-1.57l0.27,0.28v0.79l5,4.99L20.49,19l-4.99,-5zM9.5,14C7.01,14 5,11.99 5,9.5S7.01,5 9.5,5 14,7.01 14,9.5 11.99,14 9.5,14z"/></symbol>
    <symbol id="i-gallery" viewBox="0 0 24 24"><path d="M22,16L22,4c0,-1.1 -0.9,-2 -2,-2L8,2c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2zM11,12l2.03,2.71L16,11l4,5L8,16l3,-4zM2,6v14c0,1.1 0.9,2 2,2h14v-2L4,20L4,6L2,6z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4,10.5c-0.83,0 -1.5,0.67 -1.5,1.5s0.67,1.5 1.5,1.5 1.5,-0.67 1.5,-1.5 -0.67,-1.5 -1.5,-1.5zM4,4.5c-0.83,0 -1.5,0.67 -1.5,1.5S3.17,7.5 4,7.5 5.5,6.83 5.5,6 4.83,4.5 4,4.5zM4,16.5c-0.83,0 -1.5,0.68 -1.5,1.5s0.68,1.5 1.5,1.5 1.5,-0.68 1.5,-1.5 -0.67,-1.5 -1.5,-1.5zM7,19h14v-2L7,17v2zM7,13h14v-2L7,11v2zM7,5v2h14L21,5L7,5z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M19,6.41L17.59,5 12,10.59 6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 12,13.41 17.59,19 19,17.59 13.41,12z"/></symbol>
    <symbol id="i-flash" viewBox="0 0 24 24"><path d="M7,2v11h3v9l7,-12h-4l4,-8z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><path d="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM13,17h-2v-6h2v6zM13,9h-2L11,7h2v2z"/></symbol>
  </svg>

  <!-- Camera: live viewfinder, like a visual search app -->
  <main id="camera" class="screen">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="viewfinder" aria-hidden="true"></canvas>
    <div id="no-camera" class="no-camera" hidden>
      <svg class="big-icon"><use href="#i-search"/></svg>
      <h1>Identify aircraft with your camera</h1>
      <p>Allow camera access to point at a plane and identify it. Photos never leave your phone.</p>
      <button id="allow" class="primary">Allow camera</button>
    </div>
    <header class="topbar">
      <button id="torch" class="glass" aria-label="Torch" hidden><svg><use href="#i-flash"/></svg></button>
      <span class="glass-spacer" id="torch-spacer"></span>
      <div class="title"><svg><use href="#i-flight"/></svg>Aircraft Vision</div>
      <button id="types-btn" class="glass" aria-label="Aircraft it knows"><svg><use href="#i-list"/></svg></button>
    </header>
    <footer class="controls">
      <p id="cam-error" class="error" hidden></p>
      <p id="hint" class="hint">Point at an aircraft and tap search</p>
      <div class="row">
        <label class="glass big" aria-label="Choose a photo">
          <input id="file" type="file" accept="image/*" hidden>
          <svg><use href="#i-gallery"/></svg>
        </label>
        <button id="shutter" aria-label="Identify"><span><svg><use href="#i-search"/></svg></span></button>
        <span class="big-spacer"></span>
      </div>
      <span class="pill">Aircraft</span>
    </footer>
  </main>

  <!-- Result: the photo with a resizable box, and a sheet with the identification -->
  <main id="result" class="screen" hidden>
    <canvas id="photo"></canvas>
    <button id="close" class="glass" aria-label="Back to camera"><svg><use href="#i-close"/></svg></button>
    <section id="sheet" aria-live="polite">
      <div class="grabber"><span></span></div>
      <div id="sheet-body"></div>
    </section>
  </main>

  <dialog id="types">
    <div class="types-head">
      <h2 id="types-title">Aircraft it knows</h2>
      <button id="types-close" class="text">Done</button>
    </div>
    <input id="types-search" type="search" placeholder="Search, e.g. 787 or Airbus" autocomplete="off">
    <div id="types-list"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
